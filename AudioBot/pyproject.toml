[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hiremate"
version = "0.1.0"
description = "A voice-based AI interview practice CLI using the OpenAI Realtime API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai[realtime]>=3.8.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sounddevice>=0.5.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
hiremate = "hiremate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
